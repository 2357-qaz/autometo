name: CI

on:
  push:
    branches-ignore:
      - feat/v0-webui
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Reliability audit regressions
        run: npm run audit:typecheck && npm run audit:test

      - name: Build web
        run: npm run build

      - name: Build TUI
        run: npm run build -w @automedo/tui
