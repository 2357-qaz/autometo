# Xcode project for the iOS app, generated by XcodeGen (`xcodegen generate` here):
# the app (Capacitor shell around apps/web) and a widget extension that also draws the
# Live Activity. App.xcodeproj is not committed; see apps/mobile/README.md.
name: App
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  CapApp-SPM:
    path: CapApp-SPM
targets:
  App:
    type: application
    platform: iOS
    configFiles:
      Debug: ../debug.xcconfig
    sources:
      - path: App
        excludes:
          - "public"
          - "public/**"
          - "Info.plist"
          - "App.entitlements"
          - "capacitor.config.json"
          - "config.xml"
      # Written by `npx cap sync ios`: the built web app and its configuration.
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
      - path: App/config.xml
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: app.automedo.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: CapApp-SPM
      - target: AutomedoWidget
        embed: true
  AutomedoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
          - "Widget.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AutomedoWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.automedo.ios.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
schemes:
  App:
    build:
      targets:
        App: all
        AutomedoWidget: all
    run:
      config: Debug
    archive:
      config: Release
