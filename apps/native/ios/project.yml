# Xcode project of the native SwiftUI app, generated by XcodeGen (`xcodegen generate`
# here; AuTomeDoNative.xcodeproj is not committed). The app's logic is engine.js
# (`npm run build -w @automedo/native`), run in JavaScriptCore. The widget and the Live
# Activity are the same code as the Capacitor app's (../../mobile/ios/App).
name: AuTomeDoNative
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AuTomeDo:
    type: application
    platform: iOS
    sources:
      - path: AuTomeDo
        excludes:
          - "Info.plist"
          - "AuTomeDo.entitlements"
      - path: ../../mobile/ios/App/Shared
      - path: ../../mobile/ios/App/App/SessionActivityController.swift
    settings:
      base:
        PRODUCT_NAME: AuTomeDo
        PRODUCT_BUNDLE_IDENTIFIER: app.automedo.native
        INFOPLIST_FILE: AuTomeDo/Info.plist
        CODE_SIGN_ENTITLEMENTS: AuTomeDo/AuTomeDo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: TomoWidget
        embed: true
  TomoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../mobile/ios/App/Widget
        excludes:
          - "Info.plist"
          - "Widget.entitlements"
      - path: ../../mobile/ios/App/Shared
    settings:
      base:
        PRODUCT_NAME: TomoWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.automedo.native.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
  AuTomeDoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AuTomeDo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.automedo.native.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AuTomeDo:
    build:
      targets:
        AuTomeDo: all
        TomoWidget: all
    test:
      config: Debug
      targets:
        - AuTomeDoTests
    run:
      config: Debug
    archive:
      config: Release
